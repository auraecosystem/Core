<VirtualHost *:80>
    ServerName curl.local
    ServerAdmin kubulee.kl@examples.com
    DocumentRoot /path/to/curl-www

    <Directory /path/to/curl-www>
        Options +Indexes +Includes +FollowSymLinks +ExecCGI
        AllowOverride All
        
        # CGI Handler
        AddHandler cgi-script .cgi
        
        # SSI (Server Side Includes) Configuration
        AddOutputFilter INCLUDES .shtml .html
        AddType text/html .shtml
        
        # Default index files for curl-www
        DirectoryIndex index.shtml index.html

        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/curllocal-error.log
    CustomLog ${APACHE_LOG_DIR}/curllocal-access.log combined
</VirtualHost>
